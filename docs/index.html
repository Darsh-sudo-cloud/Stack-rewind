<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rewind</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Rewind</h1>
    <input type="file" id="loader" accept=".json">
  </header>

  <div class="controls">
    <button id="back">◀ Back</button>
    <button id="forward">Forward ▶</button>
    <input type="range" id="timeline" min="0" value="0">
    <span id="step-label">Step 0 / 0</span>
  </div>

  <div class="panels">
    <section><h2>Stack</h2><ol id="stack"></ol></section>
    <section><h2>Variables</h2><ul id="vars"></ul></section>
    <section>
      <h2>Find last change</h2>
      <input id="var-name" maxlength="1" placeholder="x">
      <button id="find">Find</button>
      <p id="find-result"></p>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
